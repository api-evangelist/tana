aid: tana
name: Tana
description: >-
  Tana Inc. builds two products that share the Tana brand: Tana, an agentic
  meeting platform where AI agents do real work during native video calls and
  land decisions, tasks, and drafts in a persistent context graph; and Tana
  Outliner, a knowledge-management tool built on an infinite outliner with
  supertags and nodes. Tana exposes two public HTTP APIs — the Tana Input API
  for programmatically adding nodes, fields, and supertags to an Outliner
  workspace graph (workspace-scoped bearer-token auth), and a public
  agent-native Documentation API for searching and reading Tana docs as clean
  markdown. Backed by Lightspeed Venture Partners and Northzone.
